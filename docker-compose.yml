version: '3.8'

services:
  web:
    build: .
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASS=root
      - DB_NAME=login276_absensi
    depends_on:
      - db

  db:
    image: mariadb:10.6
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=login276_absensi
    volumes:
      - db_data:/var/lib/mysql
      - ./database/login276_absensi.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  db_data:
